<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать лот — Gavel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .create-box {
      max-width: 600px; margin: 40px auto; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--text-dim); }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 12px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-family: var(--font-ui); outline: none; transition: .2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--gold); }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .row { display: flex; gap: 16px; }
    .row .form-group { flex: 1; }
    
    /* Превью фото */
    .image-preview {
      width: 100%; height: 200px; border: 2px dashed var(--border);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      color: var(--text-dim); background: var(--bg); cursor: pointer;
      background-size: cover; background-position: center; transition: .2s;
    }
    .image-preview:hover { border-color: var(--gold); color: var(--gold); }
    
    .error-msg { color: var(--danger); font-size: 14px; margin-bottom: 16px; display: none; }
    
    /* Плашка уровня */
    .level-info {
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
      padding: 12px; margin-bottom: 24px; font-size: 13px; display: flex;
      justify-content: space-between; align-items: center;
    }
  </style>
</head>
<body data-requires-auth>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Gavel<span>аукционный дом</span></a>
    <nav class="nav" id="nav">
      <a href="index.html">Лента</a>
      <a href="create-lot.html" style="color:var(--gold);">Создать лот</a>
      <a href="profile.html">Профиль</a>
      <span id="auth-slot"></span>
    </nav>
  </div>
</header>

<main class="container">
  <div class="create-box">
    <h1 class="section-title" style="margin-top:0;">Новый лот</h1>
    
    <!-- Инфо о лимитах -->
    <div class="level-info" id="level-info">
      Загрузка данных профиля...
    </div>

    <div class="error-msg" id="error-msg"></div>

    <form id="create-form">
      <div class="form-group">
        <label>Фотография предмета (обязательно)</label>
        <input type="file" id="lot-image" accept="image/*" style="display:none;" onchange="previewImage(event)">
        <div class="image-preview" id="image-preview" onclick="document.getElementById('lot-image').click()">
          Нажмите, чтобы выбрать фото
        </div>
      </div>

      <div class="form-group">
        <label>Название лота</label>
        <input type="text" id="lot-title" required placeholder="Например: Серебряный рубль 1898 г." maxlength="60">
      </div>

      <div class="form-group">
        <label>Описание</label>
        <textarea id="lot-desc" placeholder="Состояние, провенанс, особенности..." maxlength="1000"></textarea>
      </div>

      <div class="form-group">
        <label>Категория</label>
        <select id="lot-category">
          <option>Монеты</option>
          <option>Винил</option>
          <option>Живопись</option>
          <option>Антиквариат</option>
          <option>Комиксы</option>
          <option>Другое</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Стартовая цена (₽)</label>
          <input type="number" id="lot-start" required min="1" value="1000">
        </div>
        <div class="form-group">
          <label>Шаг ставки (₽)</label>
          <input type="number" id="lot-step" required min="1" value="100">
        </div>
      </div>

      <div class="form-group">
        <label>Длительность аукциона</label>
        <select id="lot-duration">
          <option value="1">1 час (для теста)</option>
          <option value="24" selected>1 день</option>
          <option value="72">3 дня</option>
          <option value="168">7 дней</option>
        </select>
      </div>

      <button type="submit" class="btn btn-solid" style="width:100%; padding:14px; font-size:16px;">Выставить на аукцион</button>
    </form>
  </div>
</main>

<script src="js/levels.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth-ui.js"></script>
<script>
  let currentUser = null;
  let base64Image = null;

  // 1. Загружаем данные текущего пользователя и его лимиты
  document.addEventListener('DOMContentLoaded', async () => {
    currentUser = await store.getMe();
    if (!currentUser) return; // auth-ui.js уже перекинет на логин

    const limits = getLimits(currentUser.deals_count);
    const lvl = getLevelInfo(currentUser.deals_count);
    
    document.getElementById('level-info').innerHTML = `
      <div>
        Ваш уровень: <strong>${lvl.name}</strong> (${currentUser.deals_count} сделок)<br>
        Лимиты: до ${limits.activeLots} активных лотов и ${limits.photos} фото.
      </div>
    `;
  });

  // 2. Обработка выбора фото (сжимаем, чтобы не переполнить память браузера)
  window.previewImage = (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (e) => {
      // Создаем картинку для сжатия
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        // Получаем сжатый base64
        base64Image = canvas.toDataURL('image/jpeg', 0.7);
        
        const preview = document.getElementById('image-preview');
        preview.style.backgroundImage = `url(${base64Image})`;
        preview.textContent = '';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  };

  // 3. Отправка формы
  document.getElementById('create-form').onsubmit = async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';

    if (!base64Image) {
      errEl.textContent = 'Пожалуйста, добавьте фотографию лота.';
      errEl.style.display = 'block';
      return;
    }

    try {
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true;
      btn.textContent = 'Публикация...';

      await store.createLot({
        sellerId: currentUser.id,
        title: document.getElementById('lot-title').value,
        description: document.getElementById('lot-desc').value,
        category: document.getElementById('lot-category').value,
        image: base64Image,
        startPrice: Number(document.getElementById('lot-start').value),
        step: Number(document.getElementById('lot-step').value),
        durationHours: Number(document.getElementById('lot-duration').value),
      });

      // Успех! Перекидываем в ленту
      window.location.href = 'index.html';

    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      e.target.querySelector('button[type="submit"]').disabled = false;
      e.target.querySelector('button[type="submit"]').textContent = 'Выставить на аукцион';
    }
  };
</script>
</body>
</html>
