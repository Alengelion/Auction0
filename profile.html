<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — Gavel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .profile-header {
      display: flex; align-items: center; gap: 24px; margin-top: 40px;
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 32px; border-radius: var(--radius);
    }
    .avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: var(--bg-soft); border: 2px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-family: var(--font); color: var(--gold);
      flex-shrink: 0;
    }
    .profile-info h1 { margin-bottom: 8px; font-size: 28px; }
    .role-badge {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: .05em;
      background: rgba(201,162,75,0.15); color: var(--gold); border: 1px solid var(--gold);
    }
    .role-media { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border-color: #a78bfa; }
    .role-company { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: #38bdf8; }

    .level-progress {
      margin-top: 24px; background: var(--bg-soft); padding: 20px;
      border-radius: 8px; border: 1px solid var(--border);
    }
    .progress-bar-bg {
      height: 12px; background: #000; border-radius: 6px; overflow: hidden;
      margin: 12px 0; border: 1px solid var(--border);
    }
    .progress-bar-fill {
      height: 100%; background: linear-gradient(90deg, #8a6d2b, var(--gold), var(--gold-soft));
      border-radius: 6px; transition: width 1s ease-out;
    }

    /* Сделки */
    .orders-list { display: flex; flex-direction: column; gap: 16px; margin-top: 24px; }
    .order-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; display: flex;
      align-items: center; gap: 20px;
    }
    .order-item img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; }
    .order-details { flex: 1; }
    .order-details h3 { font-size: 18px; margin-bottom: 4px; }
    .order-details p { font-size: 13px; color: var(--text-dim); }
    .order-price { font-size: 20px; color: var(--gold); font-weight: bold; }

    /* Уведомление о повышении уровня */
    .level-up-toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--bg-card); border: 2px solid var(--gold);
      padding: 20px; border-radius: var(--radius);
      box-shadow: 0 0 30px rgba(201,162,75,0.4);
      transform: translateY(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
    }
    .level-up-toast.show { transform: translateY(0); }
    .level-up-toast h4 { color: var(--gold); font-size: 18px; margin-bottom: 8px; font-family: var(--font); }
  </style>
</head>
<body data-requires-auth>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Gavel<span>аукционный дом</span></a>
    <nav class="nav" id="nav">
      <a href="index.html">Лента</a>
      <a href="create-lot.html">Создать лот</a>
      <a href="profile.html" style="color:var(--gold);">Профиль</a>
      <span id="auth-slot"></span>
    </nav>
  </div>
</header>

<main class="container" id="profile-content">
  <p class="muted" style="margin-top:40px;">Загрузка профиля...</p>
</main>

<div class="level-up-toast" id="level-toast">
  <h4>🎉 Новый уровень!</h4>
  <p id="level-toast-text"></p>
</div>

<script src="js/levels.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
