<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лот — Gavel</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lot-layout {
      display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
      margin-top: 40px; align-items: start;
    }
    .lot-image-large {
      width: 100%; border-radius: var(--radius); border: 1px solid var(--border);
      object-fit: cover; aspect-ratio: 1/1; background: var(--bg-soft);
    }
    .lot-info { display: flex; flex-direction: column; gap: 20px; }
    
    .lot-header h1 { font-size: 32px; margin-bottom: 8px; line-height: 1.2; }
    .lot-seller {
      display: inline-flex; align-items: center; gap: 8px; font-size: 14px;
      background: var(--bg-card); padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--border); width: fit-content;
    }

    .bid-box {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px;
    }
    .bid-current { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .05em; }
    .bid-price { font-size: 42px; color: var(--gold); font-family: var(--font); line-height: 1; margin: 8px 0 16px; }
    .bid-timer {
      font-size: 16px; color: var(--text); display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; font-weight: 500;
    }
    .bid-timer.urgent { color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .5; } 100% { opacity: 1; } }

    .bid-form-row { display: flex; gap: 10px; }
    .bid-form-row input {
      flex: 1; padding: 14px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 18px; outline: none; font-family: var(--font-ui);
    }
    .bid-form-row input:focus { border-color: var(--gold); }
    
    .bid-error { color: var(--danger); font-size: 14px; margin-top: 10px; display: none; }
    .bid-success { color: var(--success); font-size: 14px; margin-top: 10px; display: none; }

    .history-section { margin-top: 40px; }
    .history-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    .history-table th { color: var(--text-dim); padding: 10px; border-bottom: 1px solid var(--border); font-weight: normal; }
    .history-table td { padding: 10px; border-bottom: 1px solid var(--border); }
    .history-table tr:last-child td { border-bottom: none; }
    .history-table .top-bid { color: var(--gold); font-weight: bold; }

    .ended-banner {
      background: rgba(224, 83, 61, 0.1); border: 1px solid var(--danger);
      color: var(--danger); padding: 16px; border-radius: 8px; text-align: center; font-weight: bold;
    }
    
    @media (max-width: 768px) {
      .lot-layout { grid-template-columns: 1fr; gap: 24px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo">Gavel<span>аукционный дом</span></a>
    <nav class="nav" id="nav">
      <a href="index.html">Лента</a>
      <a href="create-lot.html">Создать лот</a>
      <a href="profile.html">Профиль</a>
      <span id="auth-slot"></span>
    </nav>
  </div>
</header>

<main class="container" id="lot-content">
  <!-- Сюда JS вставит данные -->
  <p class="muted" style="margin-top:40px;">Загрузка лота...</p>
</main>

<script src="js/levels.js"></script>
<script src="js/store.js"></script>
<script src="js/seed.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/auction.js"></script>
</body>
</html>
